<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>In phiếu 80×45</title>
  <link rel="stylesheet" href="lib/slip.css">
  <style>
    @page { size: 80mm 45mm; margin: 0; }
    html, body { margin: 0; padding: 0; background: #fff; }
    @media screen { body { background: #e5e7eb; } #slip { margin: 8px; display: inline-block; box-shadow: 0 1px 4px rgba(0,0,0,.3); } }
    @media print { #slip { margin: 0; } }
  </style>
</head>
<body>
  <div id="slip"></div>
  <script src="lib/slip.js"></script>
  <script src="print.js"></script>
</body>
</html>
